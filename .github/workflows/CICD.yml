name: GStore Deploy

on:
  push:
    branches:
      - dev
  release:
    types: [published]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Prepare WordPress Zip
        run: |
          WP_LINK=$(cat wp-version-control.cfg)
          wget -O "./wordpress.zip" $WP_LINK

      - name: Prepare plugins and theme zip
        run: zip -r wpcontent.zip plugins mu-plugins themes

      - name: Copy Zips to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "wordpress.zip,wpcontent.zip"
          target: ${{ github.event_name == 'push' && '/var/www/evgslesar/data/www/dev.24esl.ru' || '/var/www/evgslesar/data/www/live.24esl.ru' }}

      - name: Enable Maintenance Mode
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: ".maintenance"
          target: ${{ github.event_name == 'push' && '/var/www/evgslesar/data/www/dev.24esl.ru' || '/var/www/evgslesar/data/www/live.24esl.ru' }}

      - name: Update Wordpress Core
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Determine path: Pushing to 'dev' branch goes to DEV. Any other event (like manual dispatch) goes to LIVE.
            DEPLOY_PATH="${{ github.event_name == 'push' && '/var/www/evgslesar/data/www/dev.24esl.ru' || '/var/www/evgslesar/data/www/live.24esl.ru' }}"

            # Clean root PHP files only (preserve wp-config.php). Using maxdepth 1 to avoid nuking wp-content.
            find "$DEPLOY_PATH" -maxdepth 1 -type f -name "*.php" ! -name "wp-config.php" -delete

            rm -rf "$DEPLOY_PATH/wp-admin/"
            rm -rf "$DEPLOY_PATH/wp-includes/"
            unzip -o "$DEPLOY_PATH/wordpress.zip" -d "$DEPLOY_PATH/"
            cp -rf "$DEPLOY_PATH/wordpress/." "$DEPLOY_PATH/"
            rm -rf "$DEPLOY_PATH/wordpress/"

      - name: Update plugins and theme
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            DEPLOY_PATH="${{ github.event_name == 'push' && '/var/www/evgslesar/data/www/dev.24esl.ru' || '/var/www/evgslesar/data/www/live.24esl.ru' }}"
            rm -rf "$DEPLOY_PATH/wp-content/plugins/"
            rm -rf "$DEPLOY_PATH/wp-content/mu-plugins/"
            rm -rf "$DEPLOY_PATH/wp-content/themes/"
            unzip -o "$DEPLOY_PATH/wpcontent.zip" -d "$DEPLOY_PATH/wp-content/"
      - name: Disable Maintenance Mode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            DEPLOY_PATH="${{ github.event_name == 'push' && '/var/www/evgslesar/data/www/dev.24esl.ru' || '/var/www/evgslesar/data/www/live.24esl.ru' }}"
            rm -f "$DEPLOY_PATH/.maintenance"
            rm -f "$DEPLOY_PATH/wpcontent.zip"
            rm -f "$DEPLOY_PATH/wordpress.zip"
